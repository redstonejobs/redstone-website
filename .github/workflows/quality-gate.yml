name: Quality Gate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, test and Cloudflare build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
      NEXT_PUBLIC_SITE_URL: https://redstone.co.ke
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      RESEND_API_KEY: re_ci_placeholder
      RESEND_FROM_EMAIL: no-reply@example.com
      RESEND_FROM_NAME: Red Stone CI
      HR_SUPPORT_EMAIL: support@example.com
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build for Cloudflare
        run: npm run build:cloudflare
