name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: AI foundation tests
        run: node --test tests/ai-foundation.test.mjs
      - name: Run tests
        run: npm test
      - name: Type check
        if: ${{ always() }}
        run: npx tsc --noEmit
      - name: Lint
        if: ${{ always() }}
        run: npm run lint
